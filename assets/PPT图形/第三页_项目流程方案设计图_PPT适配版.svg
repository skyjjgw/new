<svg width="1600" height="620" viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2348"/>
      <stop offset="100%" stop-color="#10386D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E7EFF"/>
      <stop offset="100%" stop-color="#46C2FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20C07A"/>
      <stop offset="100%" stop-color="#5FE3A6"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F32"/>
      <stop offset="100%" stop-color="#FFC85B"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D6CFF"/>
      <stop offset="100%" stop-color="#AE8FFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#051221" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#69D5FF"/>
    </marker>
    <style>
      .topnote { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 18px; font-weight: 600; fill: #CFE6FF; }
      .sectionTitle { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .sectionLabel { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 15px; font-weight: 700; fill: #EAF8FF; }
      .body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 16px; font-weight: 600; fill: #F4FBFF; }
      .small { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; font-weight: 500; fill: #D8EBFF; }
      .foot { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 15px; font-weight: 600; fill: #E8F6FF; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <circle cx="150" cy="560" r="160" fill="#1E4C84" opacity="0.18"/>
  <circle cx="1480" cy="60" r="150" fill="#1E4C84" opacity="0.14"/>
  <path d="M0 92 C220 40, 460 132, 760 88 S1220 48, 1600 96" fill="none" stroke="#3B78B9" stroke-width="2" opacity="0.24"/>

  <text x="72" y="48" class="topnote">系统总体流程：道路采集 → 边缘识别 → MQTT 上云 → 地图展示 → 告警与派单闭环</text>

  <rect x="54" y="82" rx="24" ry="24" width="335" height="410" fill="#143A6A" stroke="#46A7FF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="84" y="68" rx="16" ry="16" width="128" height="36" fill="url(#blue)"/>
  <text x="112" y="92" class="sectionLabel">01 感知端</text>
  <text x="86" y="142" class="sectionTitle">道路信息采集</text>
  <text x="86" y="182" class="body">USB 摄像头</text>
  <text x="86" y="208" class="small">实时采集盲道道路场景视频</text>
  <text x="86" y="256" class="body">LC76G GPS</text>
  <text x="86" y="282" class="small">提供经纬度、卫星数与定位状态</text>
  <rect x="86" y="320" rx="16" ry="16" width="270" height="74" fill="#1E487E" stroke="#5CBEFF" stroke-width="1.6"/>
  <text x="108" y="350" class="body">输入数据</text>
  <text x="108" y="374" class="small">道路视频流 + 实时位置信息</text>
  <rect x="86" y="404" rx="16" ry="16" width="270" height="66" fill="#1E487E" stroke="#5CBEFF" stroke-width="1.6"/>
  <text x="108" y="432" class="small">为后续识别与事件判定</text>
  <text x="108" y="454" class="small">提供原始依据</text>

  <rect x="430" y="82" rx="24" ry="24" width="360" height="410" fill="#123E4C" stroke="#49D79E" stroke-width="2" filter="url(#shadow)"/>
  <rect x="460" y="68" rx="16" ry="16" width="136" height="36" fill="url(#green)"/>
  <text x="489" y="92" class="sectionLabel">02 边缘端</text>
  <text x="462" y="142" class="sectionTitle">本地智能识别与判定</text>
  <text x="462" y="182" class="body">UNO220 工业计算平台</text>
  <rect x="462" y="214" rx="15" ry="15" width="296" height="54" fill="#1A5663" stroke="#74E7B5" stroke-width="1.4"/>
  <text x="488" y="248" class="body">YOLOv8 目标检测</text>
  <rect x="462" y="280" rx="15" ry="15" width="296" height="54" fill="#1A5663" stroke="#74E7B5" stroke-width="1.4"/>
  <text x="488" y="314" class="body">ROI 命中判定</text>
  <rect x="462" y="346" rx="15" ry="15" width="296" height="70" fill="#1A5663" stroke="#74E7B5" stroke-width="1.4"/>
  <text x="488" y="376" class="body">事件状态机</text>
  <text x="488" y="400" class="small">suspected → active → cleared</text>
  <rect x="462" y="426" rx="15" ry="15" width="296" height="54" fill="#1A5663" stroke="#74E7B5" stroke-width="1.4"/>
  <text x="488" y="460" class="body">冻结 GPS 与抓拍图</text>

  <rect x="830" y="82" rx="24" ry="24" width="340" height="410" fill="#5B360E" stroke="#FFB14A" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860" y="68" rx="16" ry="16" width="140" height="36" fill="url(#orange)"/>
  <text x="890" y="92" class="sectionLabel">03 云端平台</text>
  <text x="862" y="142" class="sectionTitle">数据接入与平台消费</text>
  <text x="862" y="182" class="body">MQTT 数据上报</text>
  <text x="862" y="208" class="small">上传状态、事件与定位信息</text>
  <rect x="862" y="236" rx="15" ry="15" width="276" height="54" fill="#744612" stroke="#FFD37C" stroke-width="1.4"/>
  <text x="888" y="270" class="body">IoTSuite 设备模型</text>
  <rect x="862" y="302" rx="15" ry="15" width="276" height="54" fill="#744612" stroke="#FFD37C" stroke-width="1.4"/>
  <text x="888" y="336" class="body">DataHub 数据接入</text>
  <rect x="862" y="368" rx="15" ry="15" width="276" height="54" fill="#744612" stroke="#FFD37C" stroke-width="1.4"/>
  <text x="888" y="402" class="body">Notification 告警规则</text>
  <rect x="862" y="434" rx="15" ry="15" width="276" height="54" fill="#744612" stroke="#FFD37C" stroke-width="1.4"/>
  <text x="888" y="468" class="body">事件数据消费与存储</text>

  <rect x="1210" y="82" rx="24" ry="24" width="336" height="410" fill="#38227A" stroke="#AD96FF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1240" y="68" rx="16" ry="16" width="126" height="36" fill="url(#purple)"/>
  <text x="1269" y="92" class="sectionLabel">04 应用层</text>
  <text x="1242" y="142" class="sectionTitle">监管展示与治理闭环</text>
  <rect x="1242" y="188" rx="15" ry="15" width="272" height="58" fill="#4D33A6" stroke="#C8BBFF" stroke-width="1.4"/>
  <text x="1268" y="224" class="body">城市盲道巡检地图</text>
  <rect x="1242" y="258" rx="15" ry="15" width="272" height="58" fill="#4D33A6" stroke="#C8BBFF" stroke-width="1.4"/>
  <text x="1268" y="294" class="body">状态指标卡片</text>
  <rect x="1242" y="328" rx="15" ry="15" width="272" height="58" fill="#4D33A6" stroke="#C8BBFF" stroke-width="1.4"/>
  <text x="1268" y="364" class="body">趋势分析图表</text>
  <rect x="1242" y="398" rx="15" ry="15" width="272" height="82" fill="#4D33A6" stroke="#C8BBFF" stroke-width="1.4"/>
  <text x="1268" y="430" class="body">派单工作流</text>
  <text x="1268" y="454" class="small">告警联动、任务派发</text>
  <text x="1268" y="474" class="small">形成治理闭环</text>

  <line x1="396" y1="288" x2="424" y2="288" stroke="#69D5FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="796" y1="288" x2="824" y2="288" stroke="#69D5FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="1176" y1="288" x2="1204" y2="288" stroke="#69D5FF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="92" y="526" rx="18" ry="18" width="1420" height="64" fill="#102A52" stroke="#4EA8FF" stroke-width="1.6"/>
  <text x="122" y="567" class="foot">核心亮点：连续帧去噪、事件状态机、GPS 冻结、边云协同、地图展示与治理闭环</text>
</svg>
