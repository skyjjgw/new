server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8088;
    listen [::]:8088;
    server_name _;
    client_max_body_size 12m;
    root /opt/visionbridge/static-deploy;
    index index.html;

    location = /api/v1/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/telemetry {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/auth/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/volunteer/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/admin/ {
        # Temporary competition/demo mode: operator console is login-free.
        # Restore Basic Auth before exposing this service as a long-term public system.
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        # Public dashboard data is read-only. Mutating API calls still require
        # operator credentials; telemetry has its own token-protected route.
        auth_basic off;
        limit_except GET {
            auth_basic "VisionBridge Operator";
            auth_basic_user_file /etc/nginx/.htpasswd-visionbridge;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /webrtc/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /webrtc/$1;
        add_header Cache-Control "no-store" always;
    }

    location /hls/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(.*)$ /hls/$1;
        add_header Cache-Control "no-store" always;
    }

    location /volunteer/ {
        auth_basic off;
        root /opt/visionbridge;
        try_files $uri $uri/ /volunteer/index.html;
    }

    location / {
        auth_basic off;
        try_files $uri $uri/ /index.html;
    }
}
