name: Feature request
description: 提议新的用户能力或工程改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 约束与风险
      description: 包括隐私、安全、地图、硬件、网络和兼容性。
