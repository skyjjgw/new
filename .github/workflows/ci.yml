name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard-and-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt pytest
        working-directory: ${{ github.workspace }}
      - run: python -m pytest services/api/test_volunteer_api.py
        working-directory: ${{ github.workspace }}

  edge-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m py_compile
          edge/pi-runtime/visionbridge_edge_agent.py
          edge/pi-runtime/tools/resize_fixed_yolov8_onnx.py
          deploy/scripts/deploy_release.py
          deploy/scripts/deploy_media_stack.py

  volunteer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/volunteer
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
