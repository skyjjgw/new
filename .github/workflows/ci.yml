name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboard-and-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/dashboard/server/requirements.txt
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest server/test_volunteer_api.py

  volunteer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/volunteer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

